<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nagios Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); width: 320px; }
    h2 { text-align: center; margin-bottom: 1.5rem; color: #2c3e50; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 12px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input:focus { outline: none; border-color: #4a90d9; }
    button { width: 100%; padding: 10px; background: #4a90d9; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #357abd; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Nagios</h2>
    <form method="post" action="/nagios/j_security_check">
      <label>Username</label>
      <input type="text" name="httpd_username" autocomplete="username" autofocus>
      <label>Password</label>
      <input type="password" name="httpd_password" autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
