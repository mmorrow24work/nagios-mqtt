ScriptAlias /nagios/cgi-bin "/opt/nagios/sbin"

<Directory "/opt/nagios/sbin">
    Options ExecCGI
    AllowOverride None
    AuthType form
    AuthName "Nagios Access"
    AuthFormProvider file
    AuthUserFile /opt/nagios/etc/htpasswd.users
    AuthFormLoginRequiredLocation /nagios/login.html
    Require valid-user
    Session On
    SessionCookieName nagios_session path=/
    SessionMaxAge 3600
</Directory>

Alias /nagios "/opt/nagios/share"

<Directory "/opt/nagios/share">
    Options None
    AllowOverride None
    AuthType form
    AuthName "Nagios Access"
    AuthFormProvider file
    AuthUserFile /opt/nagios/etc/htpasswd.users
    AuthFormLoginRequiredLocation /nagios/login.html
    Require valid-user
    Session On
    SessionCookieName nagios_session path=/
    SessionMaxAge 3600
</Directory>

<Location /nagios/login.html>
    AuthType None
    Require all granted
</Location>

<Location /nagios/j_security_check>
    SetHandler form-login-handler
    AuthType form
    AuthName "Nagios Access"
    AuthFormProvider file
    AuthUserFile /opt/nagios/etc/htpasswd.users
    AuthFormLoginSuccessLocation /nagios/
    AuthFormLoginRequiredLocation /nagios/login.html
    Require valid-user
    Session On
    SessionCookieName nagios_session path=/
    SessionMaxAge 3600
</Location>
